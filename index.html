<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>CyberQuest</title>
  <link rel="icon" type="image/png" href="assets/logo-ciberseguridad.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>.gallows .part{display:none}.gallows.error-1 .head,.gallows.error-2 .head,.gallows.error-3 .head,.gallows.error-4 .head,.gallows.error-5 .head,.gallows.error-2 .torso,.gallows.error-3 .torso,.gallows.error-4 .torso,.gallows.error-5 .torso,.gallows.error-3 .arms,.gallows.error-4 .arms,.gallows.error-5 .arms,.gallows.error-4 .legs,.gallows.error-5 .legs,.gallows.error-5 .rope,.gallows.error-5 .neck-mark{display:block}.gallows-card.lost .body-motion{animation:hang-sway 1.35s ease-in-out infinite;transform-origin:175px 126px}@keyframes hang-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.with-person{display:flex;gap:25px;align-items:stretch}.with-person img{width:190px;height:210px;object-fit:cover;border-radius:14px;border:2px solid white;box-shadow:0 4px 15px #1c376326}.with-person>div{display:flex;flex-direction:column;justify-content:center}.with-person p{margin:7px 0 0}.module-card.locked{opacity:.62;background:#f7f9fc}.start:disabled{cursor:not-allowed;color:#7b879a}.points-pill{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;background:#fff5df;color:#8f5f00;border:1px solid #f9dfa5;border-radius:99px;padding:4px 8px;font:700 12px Arial,sans-serif;letter-spacing:0!important}.points-pill::before{content:'✦';color:#f4a600}.eyebrow .points-pill{vertical-align:middle;margin-left:4px}.completion h2 .points-pill{font-size:17px;vertical-align:middle}@media(max-width:600px){.with-person{gap:14px}.with-person img{width:100px;height:115px}}@media(prefers-reduced-motion:reduce){.gallows-card.lost .body-motion{animation:none}}</style>
  <style>.threat-icon{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:7px;border-radius:8px;background:#fff0ee;font-size:15px;vertical-align:middle}.celebration{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}.confetti{position:absolute;top:42%;left:50%;font-size:22px;animation:burst .8s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}</style>
<style>.points-pill::before{content:'🛡️'}.score-chip span{font-size:0}.score-chip span::after{content:'🛡️';font-size:14px}.scenario-visual{width:190px;min-width:190px;display:grid;place-items:center;border-radius:14px;background:#e7f0ff;font-size:82px}@media(max-width:600px){.scenario-visual{width:100px;min-width:100px;font-size:48px}}</style>
<style>.hero-shield::before,.hero-shield::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#d7e6ff;box-shadow:38px 32px 0 #8db8ff,-52px 46px 0 #d7e6ff,55px -32px 0 #8db8ff,-38px -45px 0 #d7e6ff;animation:float-particles 4.5s ease-in-out infinite}.hero-shield::after{width:5px;height:5px;background:#fff;box-shadow:62px 12px 0 #fff,-65px -15px 0 #8db8ff,12px 65px 0 #fff;animation-delay:-2.2s}@keyframes float-particles{50%{transform:translateY(-12px) rotate(15deg);opacity:.55}}@media(max-width:800px){.topbar{gap:12px;height:66px}.brand{font-size:13px}.app-shell{padding:24px 14px 50px}.hero{min-height:unset;padding:30px 24px;display:flex;flex-direction:column;gap:26px}.hero h1{font-size:31px}.hero p:not(.eyebrow){font-size:15px;margin-bottom:20px}.hero-shield{display:grid!important;margin:16px auto 4px;width:135px;height:135px}.hero-shield span{font-size:54px}.section-head{margin-top:32px}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.module-card{min-height:205px;padding:15px}.module-card h3{font-size:16px}.challenge-banner{padding:22px;align-items:flex-start}.challenge-banner .secondary{width:100%;margin-top:3px}.module-header{padding:20px;align-items:flex-start}.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.step{border-radius:7px!important;padding:10px 3px;font-size:10px;line-height:1.2}.activity-card{padding:24px 18px}.activity-card h2{font-size:24px}.with-person{align-items:center}.with-person img{width:130px;height:150px}.scenario-visual{width:130px;min-width:130px;height:150px;font-size:58px}.options .option{padding:14px;font-size:14px}.game-layout{padding:25px 18px}.gallows-card{min-height:290px}}@media(max-width:480px){.topbar{padding:0 12px}.brand-mark{width:34px;height:34px}.score-chip{font-size:12px}.hero{padding:27px 19px}.hero h1{font-size:28px}.module-grid{grid-template-columns:1fr}.module-card{min-height:170px}.card-footer{padding-top:11px}.module-header h1{font-size:25px}.module-header .card-icon{width:45px;height:45px}.with-person{flex-direction:column;align-items:stretch}.with-person img,.scenario-visual{width:100%;height:180px}.with-person>div{min-height:0}.step{font-size:9px;padding:9px 2px}.activity-footer .primary{width:100%}.word{font-size:22px;letter-spacing:5px}.letters{gap:5px}.letter{width:32px;height:32px}.gallows{width:200px}}</style>
<style>.auth-card{max-width:850px;margin:45px auto;background:#fff;border:1px solid #dce5f4;border-radius:22px;padding:38px}.auth-card h1{font-size:32px}.auth-card>p:not(.eyebrow){color:#627188}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.auth-grid form{background:#f4f7fc;padding:22px;border-radius:15px;display:grid;gap:10px}.auth-grid h2{font-size:21px}.auth-grid input{width:100%;padding:13px;border:1px solid #cbd7e9;border-radius:9px;font:14px Arial}.auth-message{padding:12px 14px;background:#eaf2ff;border-radius:9px;color:#155eef;margin-top:15px}@media(max-width:600px){.auth-card{margin:20px auto;padding:24px 18px}.auth-grid{grid-template-columns:1fr}}</style>
<style>.auth-single{max-width:590px}.auth-single .auth-grid{grid-template-columns:minmax(0,1fr)}.auth-switch{text-align:center;margin:5px 0 0;color:#66758c;font-size:14px}.auth-switch button{border:0;background:none;color:#155eef;font:700 14px Arial;cursor:pointer;padding:0;text-decoration:underline}</style>
<style>.admin-panel{margin-top:28px;padding:23px 26px;background:#fff8e8;border:1px solid #f4d897;border-radius:17px}.admin-panel h2{font-size:22px}.admin-panel p:not(.eyebrow){color:#66758c;margin:7px 0 16px}.admin-panel form{display:flex;gap:10px}.admin-panel input{flex:1;padding:12px;border:1px solid #d8c58f;border-radius:9px;font:14px Arial}.admin-panel small{display:block;margin-top:10px;color:#725100}@media(max-width:500px){.admin-panel form{flex-direction:column}}</style>
<style>body{background:linear-gradient(145deg,#d9efff 0%,#eef8ff 42%,#c9e8ff 100%);min-height:100vh}body::before,body::after{content:'';position:fixed;z-index:-1;border-radius:50%;opacity:.55;pointer-events:none;background:#fff;box-shadow:18vw 12vh 0 7px #a8d8ff,42vw 34vh 0 4px #fff,73vw 18vh 0 8px #a8d8ff,87vw 62vh 0 5px #fff,25vw 80vh 0 6px #a8d8ff,64vw 86vh 0 4px #fff;animation:ambient-float 15s ease-in-out infinite}body::before{width:9px;height:9px;top:5vh;left:4vw}body::after{width:6px;height:6px;top:35vh;left:8vw;animation-delay:-7s;box-shadow:25vw 5vh 0 5px #fff,55vw 29vh 0 7px #9ed1ff,82vw 40vh 0 4px #fff,35vw 67vh 0 6px #9ed1ff,91vw 90vh 0 7px #fff}@keyframes ambient-float{50%{transform:translate(18px,-30px);opacity:.85}}.topbar{background:#ffffffdc;backdrop-filter:blur(12px)}.landing-benefits{margin:42px auto 0;max-width:1000px;text-align:center;padding:38px;background:#ffffffbf;border:1px solid #fff;border-radius:24px;box-shadow:0 16px 45px #3d80b426}.landing-benefits h2{font-size:29px}.landing-benefits>p:not(.eyebrow){max-width:680px;margin:14px auto 28px;color:#536b8e;line-height:1.55}.benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;text-align:left}.benefit-grid article{background:#f4f9ff;border:1px solid #d7e8fb;border-radius:16px;padding:20px}.benefit-grid span{font-size:29px}.benefit-grid h3{margin:10px 0 5px;font:700 18px Arial}.benefit-grid p{color:#637796;font-size:14px;line-height:1.4;margin:0}@media(max-width:650px){.landing-benefits{padding:26px 18px}.landing-benefits h2{font-size:25px}.benefit-grid{grid-template-columns:1fr;text-align:center}}</style>
<style>body{background:linear-gradient(112deg,#102a63 0%,#155eef 100%) fixed}.topbar{background:#102a63e8;border-bottom-color:#ffffff2e}.brand{color:#fff}.top-progress{color:#dce9ff}.top-progress b{color:#fff}.progress-track{background:#ffffff3b}.score-chip{background:#fff5df}.app-shell{position:relative}.landing-benefits{background:#ffffffed}.module-card,.activity-card,.module-header,.game-layout{box-shadow:0 15px 35px #06173530}</style>
<style>.topbar{background:#f5f9ffef;border-bottom-color:#cfe0f6}.brand{color:#14213d}.top-progress{color:#526784}.top-progress b{color:#14213d}.progress-track{background:#d5dfef}.hero{background:transparent;box-shadow:none;border-radius:0;padding:48px 55px;min-height:290px}.hero p:not(.eyebrow){color:#e0eaff}.hero-shield{background:#ffffff08}.hero-shield::before,.hero-shield::after{z-index:-1}.app-shell::before,.app-shell::after{display:none}</style>
<style>body{font-family:"Segoe UI",Arial,sans-serif}.brand{font-family:"Trebuchet MS",Arial,sans-serif;font-size:15px;line-height:13px;letter-spacing:-.3px}.brand-mark{font:800 15px/1 "Trebuchet MS",Arial,sans-serif;letter-spacing:-1px;background:linear-gradient(145deg,#4bd1ff,#1a5dff 62%,#102a63);box-shadow:0 5px 13px #155eef55}.hero h1,h1,h2,.module-card h3,.benefit-grid h3{font-family:"Trebuchet MS","Segoe UI",sans-serif;letter-spacing:-1px}.hero h1{font-size:47px;line-height:1.08}.landing-benefits h2{font-size:34px}.module-header h1{font-size:33px}.activity-card h2{font-size:30px}@media(max-width:800px){.hero h1{font-size:38px}.landing-benefits h2{font-size:29px}}@media(max-width:480px){.hero h1{font-size:32px}.landing-benefits h2{font-size:26px}.activity-card h2{font-size:26px}}</style>
<style>@media(max-width:480px){.app-shell{padding-left:12px;padding-right:12px;overflow:hidden}.hero{padding:28px 16px;text-align:center;align-items:center}.hero>div:first-child{width:100%}.hero h1{font-size:clamp(25px,9vw,32px);overflow-wrap:anywhere}.hero p:not(.eyebrow){margin-left:auto;margin-right:auto}.hero-shield{max-width:calc(100vw - 58px);max-height:calc(100vw - 58px);margin-left:auto;margin-right:auto}.primary,.secondary{max-width:100%;white-space:normal}.landing-benefits{margin-left:0;margin-right:0;max-width:100%}}</style>
<style>.section-head h2,.section-head .eyebrow{color:#fff}.section-head .muted{color:#dbeaff}</style>
<style>.logout-btn{border:1px solid #bfd2ef;border-radius:9px;background:#fff;color:#365987;padding:8px 11px;font:700 12px Arial;cursor:pointer}.logout-btn:hover{background:#eaf2ff}.hidden{display:none!important}@media(max-width:560px){.logout-btn{padding:7px 8px;font-size:11px}.score-chip{display:none}}</style>
<style>.brand-mark{background:transparent!important;box-shadow:none!important;padding:0}.brand-mark img{display:block;width:42px;height:42px;object-fit:contain}@media(max-width:480px){.brand-mark img{width:36px;height:36px}}</style>
<style>.brand{gap:11px;font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif}.brand-mark img{width:52px;height:52px}.brand-name{display:flex;align-items:baseline;gap:3px;font-size:20px;letter-spacing:-1.3px;line-height:1}.brand-name b{color:#132d63}.brand-name strong{font-weight:800;color:#1d67e8}@media(max-width:620px){.brand-mark img{width:42px;height:42px}.brand-name{font-size:17px}}@media(max-width:430px){.brand-name{font-size:15px}.brand{gap:7px}}</style>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Ir al inicio"><span class="brand-mark"><img src="assets/logo-ciberseguridad.png" alt=""></span><span class="brand-name"><b>Cyber</b><strong>Quest</strong></span></button>
    <div class="top-progress"><span>Tu avance</span><div class="progress-track"><i id="globalProgress"></i></div><b id="globalProgressText">0%</b></div>
    <div class="score-chip" aria-label="Puntaje"><span>✦</span><b id="score">0</b> pts</div>
    <button class="logout-btn hidden" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="app-shell" id="app" tabindex="-1"></main>

  <template id="dashboardTemplate">
    <section class="hero">
      <div><p class="eyebrow">ACADEMIA DIGITAL · EMPRESAS SEGURAS</p><h1>La seguridad se construye<br>en cada decisión.</h1><p>Entrená con situaciones reales de trabajo y protegé la información sensible de tu organización.</p><button class="primary" data-action="continue">Comenzar desafío <span>→</span></button></div>
      <div class="hero-shield" aria-hidden="true"><div class="orbit o1"></div><div class="orbit o2"></div><span>⌾</span><small>SEGURO</small></div>
    </section>
    <section class="section-head"><div><p class="eyebrow">RECORRIDO FORMATIVO</p><h2>Mis módulos</h2></div><p id="moduleCounter" class="muted"></p></section>
    <section class="module-grid" id="moduleGrid"></section>
    <section class="challenge-banner"><div class="challenge-icon">⌁</div><div><p class="eyebrow">DESAFÍO EXTRA</p><h2>Ahorcado ciberseguro</h2><p>Descubrí conceptos clave antes de quedarte sin intentos.</p></div><button class="secondary" data-action="hangman">Jugar ahora →</button></section>
    <button class="reset-link" data-action="reset">Reiniciar progreso</button>
  </template>

  <template id="moduleTemplate">
    <button class="back" data-action="dashboard">← Volver al tablero</button>
    <section class="module-header" id="moduleHeader"></section>
    <nav class="stepper" id="stepper"></nav>
    <section id="activity"></section>
  </template>

  <template id="hangmanTemplate">
    <button class="back" data-action="dashboard">← Volver al tablero</button>
    <section class="game-layout"><div class="game-copy"><p class="eyebrow">DESAFÍO EXTRA</p><h1>Ahorcado ciberseguro</h1><p>Leé la definición, elegí letras y descubrí el concepto antes de agotar los intentos.</p><div class="definition" id="definition"></div><div id="word" class="word" aria-label="Palabra a adivinar"></div><p class="attempts">Errores: <b id="mistakes">0</b> de 5</p><div id="letters" class="letters"></div><button class="secondary" data-action="newWord">Otra palabra</button></div><div class="gallows-card"><svg viewBox="0 0 260 310" class="gallows" aria-label="Ahorcado"><path class="scaffold" d="M35 280H215M70 280V32H175M70 32H35M175 32V75"/><g class="body-motion"><circle class="part head" cx="175" cy="100" r="25"/><path class="part torso" d="M175 125V190"/><path class="part arms" d="M175 145L140 170M175 145L210 170"/><path class="part legs" d="M175 190L145 230M175 190L205 230"/><path class="part neck-mark" d="M143 126H207"/></g><path class="part rope" d="M175 32V126"/></svg><p id="gameMessage">¡Pensá antes de elegir!</p></div></section>
  </template>
  <script src="js/app.js"></script>
</body>
</html>
