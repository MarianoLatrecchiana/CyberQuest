  <style>
    /* Situaciones: relato simple y mensajes directos como conversación. */
    .scenario-content {
      width: 100%;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .scenario-context {
      margin: 0 !important;
      max-width: none !important;
      line-height: 1.5;
    }

    .chat-bubble {
      position: relative;
      align-self: flex-start;
      max-width: min(100%, 540px);
      padding: 13px 16px;
      border: 1px solid #cadcf7;
      border-radius: 15px 15px 15px 4px;
      background: #fff;
      color: #1b3768;
      line-height: 1.45;
      box-shadow: 0 5px 14px #1d63bb14;
    }

    .chat-bubble::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: -7px;
      border-width: 8px 8px 0 0;
      border-style: solid;
      border-color: #cadcf7 transparent transparent;
    }

    .chat-bubble::after {
      content: '';
      position: absolute;
      bottom: 1px;
      left: -5px;
      border-width: 6px 6px 0 0;
      border-style: solid;
      border-color: #fff transparent transparent;
    }

    @media (max-width: 600px) {
      .scenario-content { min-height: 0; }
      .chat-bubble { align-self: stretch; max-width: none; }
    }
  </style>

<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Ir al inicio"><span class="brand-mark"><img src="assets/logo-ciberseguridad.png" alt=""></span><span class="brand-name"><b>Cyber</b><strong>Quest</strong></span></button>
    <div class="top-progress"><span>Tu avance</span><div class="progress-track"><i id="globalProgress"></i></div><b id="globalProgressText">0%</b></div>
    <div class="score-chip" aria-label="Puntaje"><span>✦</span><b id="score">0</b> pts</div>
    <button class="logout-btn hidden" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="app-shell" id="app" tabindex="-1"></main>

  <template id="dashboardTemplate">
    <section class="hero">
      <div><p class="welcome-greeting" id="userGreeting"></p><p class="eyebrow">ACADEMIA DIGITAL · EMPRESAS SEGURAS</p><h1>La seguridad se construye<br>en cada decisión.</h1><p>CyberQuest es una plataforma de capacitación interactiva para reconocer riesgos, proteger información sensible y actuar con seguridad en el trabajo.</p><p class="hero-summary"><b>Tu recorrido incluye 6 módulos:</b> contraseñas, correo personal / corporativo, protección de datos, amenazas cibernéticas, ingeniería social y grooming. En cada uno vas a encontrar contenido guiado, mini desafíos, situaciones reales y trivias. Al finalizar, podrás realizar una evaluación integral.</p><button class="primary hero-continue hidden" data-action="continue">Comenzar desafío <span>→</span></button></div>
      <div class="hero-shield" aria-hidden="true"><div class="orbit o1"></div><div class="orbit o2"></div><span>⌾</span><small>SEGURO</small></div>
    </section>
    <section class="section-head"><div><p class="eyebrow">RECORRIDO FORMATIVO</p><h2>Mis módulos</h2></div><p id="moduleCounter" class="muted"></p></section>
    <section class="module-grid" id="moduleGrid"></section>
    <section class="challenge-banner"><div class="challenge-icon hangman-logo" aria-hidden="true"><svg class="hangman-logo-svg" viewBox="0 0 64 64"><path d="M10 8h37M48 8v14"/><path d="M48 8v4"/><g class="hangman-logo-body"><circle cx="48" cy="26" r="7"/><path d="M48 33v13M48 37l-8 6M48 37l8 6M48 46l-7 9M48 46l7 9"/></g></svg></div><div><p class="eyebrow">DESAFÍO EXTRA</p><h2>Ahorcado ciberseguro</h2><p>Descubrí conceptos clave antes de quedarte sin intentos.</p></div><button class="secondary" data-action="hangman">Jugar ahora →</button></section>
    <button class="reset-link" data-action="reset">Reiniciar progreso</button>
  </template>

  <template id="moduleTemplate">
    <button class="back" data-action="dashboard">← Volver al tablero</button>
    <section class="module-header" id="moduleHeader"></section>
    <nav class="stepper" id="stepper"></nav>
    <section id="activity"></section>
  </template>

  <template id="hangmanTemplate">
    <button class="back" data-action="dashboard">← Volver al tablero</button>
    <section class="game-layout"><div class="game-copy"><p class="eyebrow">DESAFÍO EXTRA</p><h1>Ahorcado ciberseguro</h1><p>Leé la definición, elegí letras y descubrí el concepto antes de agotar los intentos.</p><div class="definition" id="definition"></div><div id="word" class="word" aria-label="Palabra a adivinar"></div><p class="attempts">Errores: <b id="mistakes">0</b> de 5</p><div id="letters" class="letters"></div><button class="secondary" data-action="newWord">Otra palabra</button></div><div class="gallows-card"><svg viewBox="0 0 260 310" class="gallows" aria-label="Ahorcado"><path class="scaffold" d="M35 280H215M70 280V32H175M70 32H35M175 32V75"/><g class="body-motion"><circle class="part head" cx="175" cy="100" r="25"/><path class="part torso" d="M175 125V190"/><path class="part arms" d="M175 145L140 170M175 145L210 170"/><path class="part legs" d="M175 190L145 230M175 190L205 230"/><path class="part neck-mark" d="M143 126H207"/></g><path class="part rope" d="M175 32V126"/></svg><p id="gameMessage">¡Pensá antes de elegir!</p></div></section>
  </template>
  <script src="js/app.js"></script>
</body>
</html>
